<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Blue Calculator</title>
    <link rel="stylesheet" href="CaL.css">
</head>
<body>
    <div class="a">
        <div class="aa">
            <input type="text" class="aaa" readonly placeholder="0">
            
            <button id="c" class="b c" data-button="C"><i>C</i></button>
            <button id="ce" class="b c" data-button="CE"><i>CE</i></button>
            <button id="history-toggle" class="b c" data-button="H"><i>H</i></button>
            <button id="div" class="b c" data-button="/"><i>/</i></button>

            <button id="seven" class="b c" data-button="7"><i>7</i></button>
            <button id="eight" class="b c" data-button="8"><i>8</i></button>
            <button id="nine" class="b c" data-button="9"><i>9</i></button>
            <button id="mul" class="b c" data-button="*"><i>×</i></button>

            <button id="four" class="b c" data-button="4"><i>4</i></button>
            <button id="five" class="b c" data-button="5"><i>5</i></button>
            <button id="six" class="b c" data-button="6"><i>6</i></button>
            <button id="sub" class="b c" data-button="-"><i>-</i></button>

            <button id="one" class="b c" data-button="1"><i>1</i></button>
            <button id="two" class="b c" data-button="2"><i>2</i></button>
            <button id="three" class="b c" data-button="3"><i>3</i></button>
            <button id="add" class="b c" data-button="+"><i>+</i></button>
            
            <button id="zero" class="b c" data-button="0"><i>0</i></button>
            <button id="dzero" class="b c" data-button="00"><i>00</i></button>
            <button id="dot" class="b c" data-button="."><i>.</i></button>
            <button id="equal" class="b" data-button="="><i>=</i></button>
        </div>

        <div class="history-drawer" id="history-drawer">
            <div class="history-header">
                <h3>History</h3>
                <div class="history-actions">
                    <button id="clear-history">Clear</button>
                    <button id="close-history">✕</button>
                </div>
            </div>
            <ul class="history-list" id="history-list">
                <li class="empty-msg">No calculations yet</li>
            </ul>
        </div>
    </div>

    <script src="first.js"></script>
</body>
</html>
